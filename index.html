<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>3D ROGUE TPS</title>
<style>
body { margin:0; overflow:hidden; }
canvas { display:block; }
</style>
</head>
<body>

<script src="https://cdn.jsdelivr.net/npm/three@0.158.0/build/three.min.js"></script>

<script>
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(75, window.innerWidth/window.innerHeight, 0.1, 1000);
const renderer = new THREE.WebGLRenderer();
renderer.setSize(window.innerWidth, window.innerHeight);
document.body.appendChild(renderer.domElement);

// プレイヤー（人っぽい）
const player = new THREE.Group();

const body = new THREE.Mesh(
 new THREE.BoxGeometry(1,2,0.5),
 new THREE.MeshBasicMaterial({color:0x00ffff})
);
body.position.y = 1;

const head = new THREE.Mesh(
 new THREE.SphereGeometry(0.4),
 new THREE.MeshBasicMaterial({color:0xffffff})
);
head.position.y = 2.2;

player.add(body);
player.add(head);
scene.add(player);

// 地面
const ground = new THREE.Mesh(
 new THREE.PlaneGeometry(100,100),
 new THREE.MeshBasicMaterial({color:0x222222, side:THREE.DoubleSide})
);
ground.rotation.x = Math.PI/2;
scene.add(ground);

// カメラ
camera.position.set(0,5,8);

// 入力
const keys = {};
document.addEventListener("keydown", e=>keys[e.key]=true);
document.addEventListener("keyup", e=>keys[e.key]=false);

let bullets = [];
let enemies = [];

// 弾
function shoot(){
 const geometry = new THREE.SphereGeometry(0.2);
 const material = new THREE.MeshBasicMaterial({color:0xffffff});
 const bullet = new THREE.Mesh(geometry, material);

 bullet.position.copy(player.position);
 bullet.velocity = new THREE.Vector3(0,0,-1).applyQuaternion(player.quaternion).multiplyScalar(0.5);

 scene.add(bullet);
 bullets.push(bullet);
}

// 敵
function spawnEnemy(){
 const e = new THREE.Mesh(
  new THREE.BoxGeometry(1,1,1),
  new THREE.MeshBasicMaterial({color:0xff0000})
 );
 e.position.set((Math.random()-0.5)*20,0.5,(Math.random()-0.5)*20);
 scene.add(e);
 enemies.push(e);
}

document.addEventListener("click", shoot);

// ループ
function animate(){
 requestAnimationFrame(animate);

 // 移動
 if(keys["w"]) player.position.z -= 0.1;
 if(keys["s"]) player.position.z += 0.1;
 if(keys["a"]) player.position.x -= 0.1;
 if(keys["d"]) player.position.x += 0.1;

 // カメラ追従
 camera.position.x = player.position.x;
 camera.position.z = player.position.z + 8;
 camera.lookAt(player.position);

 // 弾更新
 bullets.forEach(b=>{
  b.position.add(b.velocity);
 });

 // 敵生成
 if(Math.random()<0.02) spawnEnemy();

 // 敵追尾
 enemies.forEach(e=>{
  let dir = new THREE.Vector3().subVectors(player.position, e.position).normalize();
  e.position.add(dir.multiplyScalar(0.03));
 });

 renderer.render(scene, camera);
}

animate();
</script>

</body>
</html>
